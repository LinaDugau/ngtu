<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- calendar body -->
  <rect x="96" y="128" width="320" height="288" rx="36" fill="#ffffff"/>
  <!-- header band -->
  <path d="M96 164 a36 36 0 0 1 36-36 h248 a36 36 0 0 1 36 36 v44 H96 z" fill="#e94560"/>
  <!-- rings -->
  <rect x="160" y="96" width="28" height="64" rx="14" fill="#b8b8b8"/>
  <rect x="324" y="96" width="28" height="64" rx="14" fill="#b8b8b8"/>
  <!-- day grid -->
  <g fill="#0f3460">
    <rect x="132" y="240" width="52" height="52" rx="12"/>
    <rect x="230" y="240" width="52" height="52" rx="12"/>
    <rect x="328" y="240" width="52" height="52" rx="12" opacity="0.35"/>
    <rect x="132" y="320" width="52" height="52" rx="12" opacity="0.35"/>
    <rect x="230" y="320" width="52" height="52" rx="12"/>
  </g>
  <!-- DT text accent -->
  <text x="354" y="366" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="bold" fill="#e94560" text-anchor="middle">ДТ</text>
</svg>
