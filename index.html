<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёбный календарь</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="logo"></h1>
            <nav class="nav-menu">
                <button class="nav-btn active" data-section="calendar">Календарь</button>
                <button class="nav-btn" data-section="deadlines">Дедлайны</button>
            </nav>
            <div class="theme-section">
                <button id="themeToggle" class="theme-btn">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText">Светлая</span>
                </button>
            </div>
        </div>
    </header>
    
    <main class="main-content">
        <section id="calendar-section" class="section active">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prevMonth" class="nav-arrow">&lt;</button>
                    <span id="currentMonth"></span>
                    <button id="nextMonth" class="nav-arrow">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </section>
        
        <section id="deadlines-section" class="section">
            <div class="deadlines-container">
                <select id="monthSelect" class="month-select">
                    <option value="2026-09">Сентябрь 2026</option>
                    <option value="2026-10">Октябрь 2026</option>
                    <option value="2026-11">Ноябрь 2026</option>
                    <option value="2026-12">Декабрь 2026</option>
                    <option value="2027-01">Январь 2027</option>
                </select>
                <div id="deadlinesList" class="deadlines-list"></div>
            </div>
        </section>
    </main>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 id="modalDate"></h3>
            <div id="modalInfo"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
